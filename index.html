<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Scroll Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 class="headline">W E L C O M E &nbsp; I T Z &nbsp; F I Z Z</h1>
            <div class="metrics">
                <div class="metric">
                    <h2>98%</h2>
                    <p>Customer Satisfaction</p>
                </div>
                <div class="metric">
                    <h2>50M+</h2>
                    <p>Miles Driven</p>
                </div>
                <div class="metric">
                    <h2>24/7</h2>
                    <p>Support Available</p>
                </div>
            </div>
        </div>
        
        <!-- Placeholder for the main visual element (car) to be animated later -->
        <div class="visual-element-container">
            <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Sport Car" class="main-visual" id="main-visual">
        </div>
    </section>
    
    <!-- Extra space to allow scrolling -->
    <section class="scroll-space">
        <h2>Scroll down to see the magic</h2>
    </section>

    <!-- GSAP for later -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
