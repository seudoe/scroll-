<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Scroll Animation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom tweaks */
        body { overflow-x: hidden; }
        /* Add some glow to headline */
        .headline-glow {
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        /* Performance optimization (Point 4) */
        .main-visual, #hero-content {
            will-change: transform, opacity;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <section class="relative h-screen w-full flex flex-col justify-center items-center text-center overflow-hidden px-8" id="hero">
        <div class="z-10 relative mt-[-15vh]" id="hero-content">
            <h1 class="text-3xl md:text-5xl lg:text-6xl font-extrabold tracking-[0.5em] mb-12 text-sky-400 uppercase headline headline-glow">
                WELCOME &nbsp; ITZ &nbsp; FIZZ
            </h1>
            <div class="flex flex-wrap gap-8 md:gap-16 justify-center metrics">
                <div class="metric">
                    <h2 class="text-4xl text-violet-400 font-bold mb-2">98%</h2>
                    <p class="text-slate-400 uppercase tracking-widest text-xs md:text-sm">Customer Satisfaction</p>
                </div>
                <div class="metric">
                    <h2 class="text-4xl text-violet-400 font-bold mb-2">50M+</h2>
                    <p class="text-slate-400 uppercase tracking-widest text-xs md:text-sm">Miles Driven</p>
                </div>
                <div class="metric">
                    <h2 class="text-4xl text-violet-400 font-bold mb-2">24/7</h2>
                    <p class="text-slate-400 uppercase tracking-widest text-xs md:text-sm">Support Available</p>
                </div>
            </div>
        </div>
        
        <!-- Placeholder for the main visual element (car) to be animated later -->
        <div class="absolute bottom-[-15%] w-full max-w-4xl z-0 visual-element-container flex justify-center" style="perspective: 1000px;">
            <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Sport Car" class="w-full max-w-3xl h-auto rounded-3xl shadow-2xl shadow-sky-900/20 main-visual" id="main-visual">
        </div>
    </section>
    
    <!-- Extra space to allow scrolling -->
    <section class="h-[150vh] bg-slate-800 flex justify-center items-start pt-32">
        <h2 class="text-slate-500 text-3xl font-light tracking-widest">SCROLL DOWN</h2>
    </section>

    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
