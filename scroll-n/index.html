<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Scroll Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scroll-root" id="container">
        <div class="sticky-wrap">
            <div class="bg-dark"></div>

            <div class="road-band">
                <!-- z-3: base text (transparent) -->
                <span class="headline-text">
                    W&nbsp;E&nbsp;L&nbsp;C&nbsp;O&nbsp;M&nbsp;E&nbsp;&nbsp;&nbsp;&nbsp;I&nbsp;T&nbsp;Z&nbsp;F&nbsp;I&nbsp;Z&nbsp;Z
                </span>

                <!-- z-4: green ribbon -->
                <div class="green-ribbon" id="ribbon">
                    <span class="headline-text">
                        W&nbsp;E&nbsp;L&nbsp;C&nbsp;O&nbsp;M&nbsp;E&nbsp;&nbsp;&nbsp;&nbsp;I&nbsp;T&nbsp;Z&nbsp;F&nbsp;I&nbsp;Z&nbsp;Z
                    </span>
                </div>

                <!-- z-5: car -->
                <div class="car-wrap" id="car">
                    <img src="assets/car.png" class="car-img" alt="McLaren 720S top view">
                </div>
            </div>

            <!-- Stat cards -->
            <div class="stats-grid">
                <div class="stat-card stat-top-left" style="background: #6b7a1a;" id="stat-1">
                    <span class="stat-value">58%</span>
                    <span class="stat-label">Increase in pick up point use</span>
                </div>
                <div class="stat-card stat-top-right" style="background: #2e3033;" id="stat-2">
                    <span class="stat-value">27%</span>
                    <span class="stat-label">Increase in pick up point use</span>
                </div>
                <div class="stat-card stat-bottom-left" style="background: #1a5276;" id="stat-3">
                    <span class="stat-value">23%</span>
                    <span class="stat-label">Decreased in customer phone calls</span>
                </div>
                <div class="stat-card stat-bottom-right" style="background: #7d3a0e;" id="stat-4">
                    <span class="stat-value">40%</span>
                    <span class="stat-label">Decreased in customer phone calls</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
